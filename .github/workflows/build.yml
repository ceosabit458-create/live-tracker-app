name: Build Android WebView APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: actions/setup-android@v3

      - name: Verify index.html Exists
        run: |
          if [ -f "index.html" ]; then
            echo "index.html found successfully!"
          else
            echo "index.html missing!" && exit 1
          fi
          
