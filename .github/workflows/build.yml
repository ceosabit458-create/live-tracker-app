name: Build Android Webview APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Webview APK
      run: |
        npm install -g pwa-builder
        mkdir -p android_app
        cp index.html android_app/
        cd android_app
        echo '{"name":"Live Tracker","short_name":"LiveTracker","start_url":"/index.html","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://via.placeholder.com/192","sizes":"192x192","type":"image/png"}]}' > manifest.json

    - name: Upload Source
      uses: actions/upload-artifact@v4
      with:
        name: LiveTracker-Web-Package
        path: index.html
        
